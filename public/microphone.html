<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03080c">
  <link rel="icon" href="data:,">
  <title>Microphone · Chimera</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #03080c;
      --panel: #071119;
      --line: #254253;
      --ink: #eaf7ff;
      --label: #a9dcf8;
      --amber: #ffb340;
      font-family: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    main { width: min(1500px, 100%); margin: auto; padding: 28px clamp(16px, 4vw, 48px) 48px; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 32px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
    .brand { color: var(--label); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; }
    .heading { display: flex; gap: 12px 20px; align-items: baseline; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(23px, 4vw, 32px); line-height: 1.1; }
    p { margin: 0; line-height: 1.5; }
    figcaption span { color: var(--label); }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; margin: 0; }
    button { padding: 10px 18px; min-height: 44px; color: #15100a; background: var(--amber); border: 1px solid var(--amber); font: inherit; font-weight: 650; cursor: pointer; }
    button.active { background: transparent; color: var(--amber); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    [role="status"] { font-size: 15px; }
    figure { margin: 16px 0 0; border: 1px solid var(--line); background: var(--panel); }
    figcaption { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    figcaption strong { font-size: 18px; }
    figcaption span { font: 13px ui-monospace, monospace; }
    canvas { display: block; width: 100%; height: clamp(145px, 22vh, 220px); }
    .note { margin-top: 16px; color: var(--label); font-size: 14px; }
    .displays { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
    .displays figure { margin: 0; min-width: 0; }
    .displays .plot { display: flex; flex-direction: column; }
    .plot canvas { flex: 1 0 auto; }
    .head-panel { display: flex; flex-direction: column; grid-row: span 2; background: #000; }
    .view-buttons { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .view-buttons button { background: transparent; color: var(--label); border: 1px solid var(--line); min-height: 36px; font-size: 13px; padding: 4px 10px; }
    .view-buttons button[aria-pressed="true"] { color: var(--ink); border-color: #4fb6f2; }
    #head-view { height: clamp(325px, 63vh, 700px); filter: drop-shadow(0 0 1px #69bafa55); flex: 1 0 auto; min-height: 0; touch-action: none; cursor: grab; }
    #head-view:active { cursor: grabbing; }
    #head-view.flat { touch-action: pan-y; cursor: default; }
    .legend, .gesture { margin: 0; padding: 4px 16px; font-size: 13px; }
    .legend { display: flex; gap: 5px 16px; flex-wrap: wrap; }
    .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--key); }
    .gesture { color: var(--label); padding-bottom: 12px; }
    @media (max-width: 760px) {
      .displays { grid-template-columns: minmax(0, 1fr); }
      .head-panel { grid-row: auto; }
      #head-view { height: clamp(300px, 48vh, 480px); }
    }
    @media (max-width: 520px) {
      main { padding-top: 16px; }
      .controls { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
    <div class="heading"><span class="brand">Chimera</span><h1>Microphone</h1></div>
    <div class="controls">
      <button id="toggle" type="button">Start microphone</button>
      <p id="status" role="status">Microphone off</p>
    </div>
    </header>
    <div class="displays">
    <figure class="head-panel">
      <figcaption><strong>Vocal tract</strong>
        <div class="view-buttons" role="group" aria-label="Head view">
          <button id="view3d" type="button" aria-pressed="true">3D</button>
          <button id="view2d" type="button" aria-pressed="false">2D section</button>
          <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          <button id="reset-view" type="button">Reset view</button>
        </div>
      </figcaption>
      <canvas id="head-view" tabindex="0" role="img" aria-label="Rotatable 3D wireframe of the head and vocal tract" aria-describedby="gesture"></canvas>
      <div class="legend">
        <span style="--key:#5be381">Tongue</span><span style="--key:#ff5d40">Jaw</span><span style="--key:#ff73cf">Lips</span><span style="--key:#eef6f8">Soft palate</span>
      </div>
      <p class="gesture" id="gesture">Drag or use arrow keys to rotate in 3D. Scroll or press + and − to zoom.</p>
    </figure>
    <figure class="plot">
      <figcaption><strong>Waveform</strong><span>Input level <b id="level">—</b></span></figcaption>
      <canvas id="wave" role="img" aria-label="Microphone waveform over the last 20 milliseconds"></canvas>
    </figure>
    <figure class="plot">
      <figcaption><strong>Frequency spectrum</strong><span>Strongest frequency <b id="peak">—</b></span></figcaption>
      <canvas id="spectrum" role="img" aria-label="Microphone spectrum from low to high frequencies"></canvas>
    </figure>
    </div>
    <p class="note">The mouth motion illustrates your sound level and tone. The charts show the microphone signal. Your audio stays in this browser. You can stop the microphone at any time.</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const toggle = $("toggle");
    const wave = $("wave");
    const spectrum = $("spectrum");
    const waveMs = 20;
    const minHz = 50;
    const floorDb = -90;
    let session = null;

    // The embedded polylines and the two speech poses come from Chimera's Anatomy3D.
    // Project them locally, so the downloaded file also works offline without WebGL.
    function createHeadView() {
      const canvas = $("head-view");
      const ctx = canvas.getContext("2d");
      const bytes = Uint8Array.from(atob($("head-mesh").textContent.trim()), (c) => c.charCodeAt(0));
      const data = new DataView(bytes.buffer);
      const lines = [];
      let offset = 0;
      function coordinates(count) {
        const points = new Float32Array(count);
        for (let i = 0; i < count; i++, offset += 2) points[i] = data.getInt16(offset, true) / 512;
        return points;
      }
      while (offset < data.byteLength) {
        const count = data.getUint16(offset, true) * 3;
        const color = "#" + Array.from(bytes.subarray(offset + 2, offset + 5), (c) => c.toString(16).padStart(2, "0")).join("");
        const width = bytes[offset + 5] / 32, alpha = bytes[offset + 6] / 255, flags = bytes[offset + 7];
        offset += 8;
        const base = coordinates(count);
        const open = flags & 1 ? coordinates(count) : null;
        const spread = flags & 1 ? coordinates(count) : null;
        lines.push({ base, open, spread, color, width, alpha, section: !!(flags & 2), hot: !!(flags & 4) });
      }
      const homeYaw = 0.62, homeTilt = 0.20;
      let yaw = homeYaw, tilt = homeTilt, zoom = 1, section = false;
      let opening = 0, spreading = 0;
      let lastDraw = "";

      function draw() {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        // Idle microphone frames and settled poses need no repaint.
        const key = [w, h, dpr, yaw, tilt, zoom, section, opening.toFixed(3), spreading.toFixed(3)].join("/");
        if (key === lastDraw) return;
        lastDraw = key;
        const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
        if (canvas.width !== pw || canvas.height !== ph) {
          canvas.width = pw;
          canvas.height = ph;
        }
        ctx.setTransform(pw / w, 0, 0, ph / h, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.lineCap = ctx.lineJoin = "round";
        const az = section ? 0 : yaw, el = section ? 0 : tilt;
        const ca = Math.cos(az), sa = Math.sin(az), ce = Math.cos(el), se = Math.sin(el);
        const scale = Math.min(w / 23, h / 31.5) * zoom;
        for (const line of lines) {
          if (section && !line.section) continue;
          ctx.beginPath();
          for (let i = 0; i < line.base.length; i += 3) {
            let x = line.base[i] - 0.3, y = line.base[i + 1] - 9.2, z = line.base[i + 2];
            if (line.open) {
              x += opening * line.open[i] + spreading * line.spread[i];
              y += opening * line.open[i + 1] + spreading * line.spread[i + 1];
              z += opening * line.open[i + 2] + spreading * line.spread[i + 2];
            }
            const depth = x * sa + z * ca;
            const perspective = section ? 1 : 68 / (68 - depth * ce - y * se);
            const px = w / 2 + (x * ca - z * sa) * scale * perspective;
            const py = h / 2 - (y * ce - depth * se) * scale * perspective;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.strokeStyle = line.color;
          ctx.globalAlpha = line.alpha;
          ctx.lineWidth = line.width * Math.min(1.3, Math.max(0.95, scale / 16));
          ctx.stroke();
          if (line.hot) {
            ctx.globalAlpha = line.alpha * 0.38;
            ctx.lineWidth *= 0.45;
            ctx.strokeStyle = "#ecfaff";
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
      }

      let pointer = null;
      function orbit(dx, dy) {
        yaw += dx;
        tilt = Math.max(-1.15, Math.min(1.15, tilt + dy));
        draw();
      }
      function reset() {
        yaw = homeYaw;
        tilt = homeTilt;
        zoom = 1;
        draw();
      }
      function select(isSection) {
        section = isSection;
        $("view3d").setAttribute("aria-pressed", String(!section));
        $("view2d").setAttribute("aria-pressed", String(section));
        canvas.setAttribute("aria-label", section ? "Side section of the vocal tract" : "Rotatable 3D wireframe of the head and vocal tract");
        canvas.classList.toggle("flat", section);
        draw();
      }
      $("view3d").addEventListener("click", () => select(false));
      $("view2d").addEventListener("click", () => select(true));
      $("reset-view").addEventListener("click", reset);
      canvas.addEventListener("pointerdown", (e) => {
        if (section || pointer || e.button !== 0) return;
        pointer = { id: e.pointerId, x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (e.pointerId !== pointer?.id) return;
        orbit((pointer.x - e.clientX) * 0.009, (e.clientY - pointer.y) * 0.009);
        pointer.x = e.clientX;
        pointer.y = e.clientY;
      });
      canvas.addEventListener("lostpointercapture", () => { pointer = null; });
      canvas.addEventListener("dblclick", reset);
      function magnify(factor) {
        zoom = Math.max(0.65, Math.min(2.2, zoom * factor));
        draw();
      }
      $("zoom-in").addEventListener("click", () => magnify(1.15));
      $("zoom-out").addEventListener("click", () => magnify(1 / 1.15));
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        magnify(Math.exp(-Math.sign(e.deltaY) * 0.08));
      }, { passive: false });
      canvas.addEventListener("keydown", (e) => {
        switch (e.key) {
          case "ArrowLeft": if (!section) orbit(-0.13, 0); break;
          case "ArrowRight": if (!section) orbit(0.13, 0); break;
          case "ArrowUp": if (!section) orbit(0, 0.10); break;
          case "ArrowDown": if (!section) orbit(0, -0.10); break;
          case "+": case "=": magnify(1.1); break;
          case "-": magnify(1 / 1.1); break;
          case "Home": reset(); break;
          default: return;
        }
        e.preventDefault();
      });

      return (rms, brightness, listening) => {
        if (listening) {
          const loudness = Math.max(0, Math.min(1, (20 * Math.log10(Math.max(rms, 1e-6)) + 58) / 40));
          const targetOpen = loudness * (1 - brightness);
          const targetSpread = loudness * brightness;
          opening += (targetOpen - opening) * 0.36;
          spreading += (targetSpread - spreading) * 0.36;
        } else {
          opening = spreading = 0;
        }
        draw();
      };
    }
    const updateHead = createHeadView();

    function drawChart(canvas, xTicks, yTicks, trace) {
      const width = canvas.clientWidth, height = canvas.clientHeight;
      if (!width || !height) return;
      const ratio = Math.min(window.devicePixelRatio || 1, 3);
      const pxWidth = Math.round(width * ratio), pxHeight = Math.round(height * ratio);
      if (canvas.width !== pxWidth || canvas.height !== pxHeight) {
        canvas.width = pxWidth;
        canvas.height = pxHeight;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(pxWidth / width, 0, 0, pxHeight / height, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const left = 48, top = 15, right = width - 19, bottom = height - 26;
      const x = (fraction) => left + fraction * (right - left);
      const y = (fraction) => bottom - fraction * (bottom - top);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#254253";
      ctx.fillStyle = "#a9dcf8";
      ctx.font = "12px ui-monospace, monospace";
      ctx.beginPath();
      for (const [pos, label] of xTicks) {
        ctx.moveTo(x(pos), top);
        ctx.lineTo(x(pos), bottom);
        ctx.textAlign = pos === 0 ? "left" : pos === 1 ? "right" : "center";
        ctx.fillText(label, x(pos), height - 7);
      }
      for (const [pos, label] of yTicks) {
        ctx.moveTo(left, y(pos));
        ctx.lineTo(right, y(pos));
        ctx.textAlign = "right";
        ctx.fillText(label, left - 6, y(pos) + 4);
      }
      ctx.stroke();
      ctx.beginPath();
      trace(ctx, x, y, Math.max(1, right - left));
      ctx.strokeStyle = "#ffb340";
      ctx.lineWidth = 1.7;
      ctx.stroke();
    }

    function render(now = 0) {
      const input = session?.analyser ? session : null;
      let amplitude = 0, energy = 0, peakHz = 0, peakDb = -Infinity;
      const rate = input?.context.sampleRate ?? 48000;
      const maxHz = Math.min(12000, rate / 2);
      const hzPosition = (hz) => Math.log(hz / minHz) / Math.log(maxHz / minHz);
      const samples = input?.samples, bins = input?.bins;
      const count = samples ? Math.min(samples.length, Math.round(rate * waveMs / 1000)) : 0;
      const start = samples ? samples.length - count : 0;
      if (input) {
        input.analyser.getFloatTimeDomainData(samples);
        input.analyser.getFloatFrequencyData(bins);
        for (let i = start; i < samples.length; i++) {
          amplitude = Math.max(amplitude, Math.abs(samples[i]));
          energy += samples[i] * samples[i];
        }
      }
      // Scale the waveform to show quiet speech. The axis labels give its actual amplitude.
      const scale = amplitude <= 0.05 && input ? 0.05 : amplitude <= 0.25 && input ? 0.25 : Math.max(1, Math.ceil(amplitude));
      drawChart(wave, [[0, "−20 ms"], [0.5, "−10 ms"], [1, "Now"]],
        [[0, "−" + scale], [0.5, "0"], [1, "+" + scale]], (ctx, x, y, pixels) => {
          if (!samples) return;
          // Keep short peaks even when a screen pixel spans several samples.
          const columns = Math.min(pixels, count);
          for (let c = 0; c < columns; c++) {
            const first = start + Math.floor(c * count / columns);
            const end = start + Math.floor((c + 1) * count / columns);
            let low = samples[first], high = low;
            for (let i = first + 1; i < end; i++) {
              low = Math.min(low, samples[i]);
              high = Math.max(high, samples[i]);
            }
            const at = x(c / Math.max(1, columns - 1));
            const lowY = y(0.5 + low / (2 * scale));
            if (c === 0) ctx.moveTo(at, lowY);
            else ctx.lineTo(at, lowY);
            ctx.lineTo(at, y(0.5 + high / (2 * scale)));
          }
        });

      const ticks = [[0, "50 Hz"], [hzPosition(200), "200"], [hzPosition(1000), "1k"], [1, (maxHz / 1000) + " kHz"]];
      drawChart(spectrum, ticks, [[0, "−90"], [1 / 3, "−60"], [2 / 3, "−30"], [1, "0 dB"]],
        (ctx, x, y) => {
          if (!bins) return;
          const binHz = rate / input.analyser.fftSize;
          const first = Math.ceil(minHz / binHz);
          for (let i = first; i < bins.length && i * binHz <= maxHz; i++) {
            const db = bins[i];
            if (db > peakDb) {
              peakDb = db;
              peakHz = i * binHz;
            }
            const at = x(hzPosition(i * binHz));
            const level = Math.max(0, Math.min(1, (db - floorDb) / -floorDb));
            if (i === first) ctx.moveTo(at, y(level));
            else ctx.lineTo(at, y(level));
          }
        });
      const rms = count ? Math.sqrt(energy / count) : 0;
      let low = 0, high = 0;
      if (input && rms > 0.001) {
        const binHz = rate / input.analyser.fftSize;
        const end = Math.min(bins.length, Math.ceil(5000 / binHz));
        for (let i = Math.ceil(100 / binHz); i < end; i++) {
          const power = 10 ** (bins[i] / 10);
          if (i * binHz < 1200) low += power;
          else high += power;
        }
      }
      updateHead(rms, high / (low + high || 1), !!input);
      if (input && now >= input.nextReading) {
        $("level").textContent = rms > 0.000032 ? Math.round(20 * Math.log10(rms)) + " dBFS" : "Quiet";
        $("peak").textContent = peakDb > floorDb ? Math.round(peakHz) + " Hz" : "—";
        input.nextReading = now + 150;
      }
    }

    function stop(message = "Microphone off") {
      const old = session;
      session = null;
      if (old) {
        cancelAnimationFrame(old.frame);
        old.stream?.getTracks().forEach((track) => track.stop());
        old.source?.disconnect();
        old.analyser?.disconnect();
        if (old.context && old.context.state !== "closed") void old.context.close().catch(() => {});
      }
      toggle.textContent = "Start microphone";
      toggle.classList.remove("active");
      $("status").textContent = message;
      $("level").textContent = $("peak").textContent = "—";
      render();
    }

    function errorMessage(error) {
      switch (error.name) {
        case "NotAllowedError":
        case "SecurityError": return "Microphone access was blocked. Allow it in your browser’s site settings and try again.";
        case "NotFoundError": return "No microphone found. Connect one and try again.";
        case "NotReadableError": return "The microphone is unavailable. Check your input device and try again.";
        default: return "Could not start the microphone. Check your input device and try again.";
      }
    }

    async function start() {
      if (!window.isSecureContext) return stop("Open this page over HTTPS or on localhost to use your microphone.");
      if (!navigator.mediaDevices?.getUserMedia || !window.AudioContext) return stop("This browser does not support live microphone input.");
      const input = { frame: 0, nextReading: 0 };
      session = input;
      toggle.textContent = "Cancel";
      toggle.classList.add("active");
      $("status").textContent = "Waiting for microphone access…";
      try {
        // Resume within the button gesture. Keep track of a late permission grant after Cancel.
        input.context = new AudioContext();
        const resume = input.context.resume();
        const capture = navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
          if (session !== input) stream.getTracks().forEach((track) => track.stop());
          else {
            input.stream = stream;
            const track = stream.getAudioTracks()[0];
            const ended = () => {
              if (session === input) stop("Microphone disconnected. Check your input device and try again.");
            };
            track.addEventListener("ended", ended, { once: true });
            if (track.readyState === "ended") ended();
          }
        });
        await Promise.all([capture, resume]);
        if (session !== input) return;
        input.analyser = input.context.createAnalyser();
        input.analyser.fftSize = 4096;
        input.analyser.smoothingTimeConstant = 0.55;
        input.samples = new Float32Array(input.analyser.fftSize);
        input.bins = new Float32Array(input.analyser.frequencyBinCount);
        input.source = input.context.createMediaStreamSource(input.stream);
        input.source.connect(input.analyser); // Analysis only. No connection to the speakers.
        toggle.textContent = "Stop microphone";
        $("status").textContent = "Listening";
        let lastFrame = -Infinity;
        function tick(now) {
          if (session !== input) return;
          if (now - lastFrame >= 1000 / 30) {
            render(now);
            lastFrame = now;
          }
          input.frame = requestAnimationFrame(tick);
        }
        input.frame = requestAnimationFrame(tick);
      } catch (error) {
        if (session === input) stop(errorMessage(error));
      }
    }

    toggle.addEventListener("click", () => session ? stop() : void start());
    window.addEventListener("pagehide", () => stop());
    window.addEventListener("resize", () => render(performance.now()));
    render();
  </script>
</body>
</html>
